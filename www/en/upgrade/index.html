ion uses the browser's \u003cwca\u003eWeb Crypto API\u003c/wca\u003e (AES-256-GCM). \u003cnewv\u003eNew vaults\u003c/newv\u003e derive keys with \u003cargon\u003eArgon2id\u003c/argon\u003e (WebAssembly); \u003coldv\u003eolder vaults\u003c/oldv\u003e may use PBKDF2-SHA256 with stored iteration counts. A password verifier uses SHA-256.\",\"securityP2\":\"Protection depends on your passphrase and backups. Client-side code can be inspected; strong crypto is what keeps ciphertext useless without your password. This is not a claim of \\\"unhackable\\\" software — use a long, unique passphrase and safe backup practices.\",\"securityPageLink\":\"Read the full Security \u0026 Architecture page\",\"dpdpHeading\":\"Privacy \u0026 Compliance\",\"dpdpLead\":\"SecureVault is designed to align with India's Digital Personal Data Protection Act, 2023.\",\"dpdpIntro\":\"Our local-first architecture is built to support the Act's core principles in how personal data is handled in the app:\",\"dpdpMinimise\":\"Data minimisation — we only keep what you choose to add to your vault; there is no background harvesting of contacts, location, or unrelated device data for vault features.\",\"dpdpPurpose\":\"Purpose limitation — the product is for family document storage and organisation on your device, not advertising profiles or third-party data sales.\",\"dpdpStorage\":\"Storage limitation — you control retention; delete individual documents or wipe the entire vault anytime from Settings.\",\"dpdpAccess\":\"Right to access — you always have full access to every record stored in your vault on this device.\",\"dpdpErasure\":\"Right to erasure — clear documents or wipe the vault permanently from this device when you choose.\",\"dpdpLocal\":\"Stronger than many cloud vaults require: vault contents never leave your device unless you export a backup yourself.\",\"dpdpDisclaimer\":\"This describes how SecureVault is designed. It is not a formal certification, audit report, or legal advice. \\\"Aligned with\\\" / \\\"designed to support\\\" means architectural intent — not a certified compliance claim.\",\"termsHeading\":\"Terms \u0026 conditions\",\"termsEffective\":\"Effective as of your use of the app · last updated with this build\",\"t1Title\":\"1. Acceptance\",\"t1Body\":\"By installing, accessing, or using SecureVault, you agree to these Terms and our Privacy Policy. If you do not agree, do not use the app.\",\"t2Title\":\"2. The service\",\"t2Body\":\"SecureVault is client-side software that helps you store and organize documents and related metadata locally. Features may include exports, optional integrations, or subscription tiers (e.g. Pro). The exact feature set depends on the version you run.\",\"t3Title\":\"3. Your responsibilities\",\"t3Body\":\"You are responsible for your devices, passwords, and any backups. You must not use the app for unlawful purposes or in violation of third-party rights. You should only store data you are allowed to hold and encrypt.\",\"t4Title\":\"4. License to use\",\"t4Body\":\"We grant you a personal, non-transferable, revocable license to use the app in line with its intended purpose. You may not reverse engineer, misuse, or redistribute the app or its assets except where allowed by applicable law.\",\"t5Title\":\"5. Disclaimers\",\"t5Body\":\"The app is provided \u003casis\u003e\\\"as is\\\"\u003c/asis\u003e and \u003casavail\u003e\\\"as available\\\"\u003c/asavail\u003e. We do not warrant uninterrupted or error-free operation. Cryptography reduces risk but cannot eliminate all threats (malware, weak passwords, physical access, etc.).\",\"t6Title\":\"6. Limitation of liability\",\"t6Body\":\"To the maximum extent permitted by law, in no event shall the developers or contributors be liable for indirect, incidental, special, consequential, or punitive damages, or for loss of data, profits, or goodwill — including from forgotten passwords, failed backups, device loss, or software defects. Your sole remedy may be to stop using the app.\",\"t7Title\":\"7. Changes\",\"t7Body\":\"We may update these Terms or the app. Continued use after changes constitutes acceptance of the revised Terms where permitted by law. Material changes may be communicated in-app or on the project site.\",\"t8Title\":\"8. Contact\",\"t8Body\":\"For privacy-related requests, see the contact information in the Privacy Policy. For other legal notices, use the contact channel published with the app or distribution listing.\",\"disclaimerHeading\":\"Disclaimer\",\"disclaimerReadCarefully\":\"Read carefully\",\"disclaimerP1\":\"SecureVault is provided \u003casis\u003e\\\"as is\\\"\u003c/asis\u003e and \u003casavail\u003e\\\"as available\\\"\u003c/asavail\u003e, without warranties to the fullest extent permitted by law. The developers and contributors are \u003cnoliab\u003enot liable\u003c/noliab\u003e for loss or damage including data loss, failed backups or restores, device or browser issues, forgotten passwords, or software errors. To the maximum extent permitted by law, there is no liability for indirect, consequential, or punitive damages.\",\"disclaimerP2\":\"Nothing here is legal, financial, or professional advice. The Terms above are a general supplement to this summary; if anything conflicts, the clearer risk disclosures and applicable law govern.\"},\"securityPage\":{\"eyebrow\":\"Security\",\"title\":\"Security \u0026 Architecture\",\"intro\":\"How SecureVault protects family documents on this device — without uploading your vault to any server.\",\"diffHeading\":\"Why we're different\",\"diffBody\":\"Unlike cloud-based vaults, your documents are never uploaded to any server — not even ours. There is nothing remote to breach for vault contents. Encryption, key derivation, and storage all happen on your device.\",\"encHeading\":\"Encryption\",\"encBody\":\"Vault data is encrypted with AES-256-GCM using the Web Crypto API. Each encryption operation uses a fresh random IV so identical plaintexts do not produce identical ciphertext.\",\"kdfHeading\":\"Key derivation\",\"kdfBody\":\"New vaults derive the AES key from your password with Argon2id (via WebAssembly) — an OWASP-recommended memory-hard function that resists GPU and ASIC cracking better than older PBKDF2 schemes commonly used elsewhere. Some older vaults may still use PBKDF2-SHA256 with stored iteration counts.\",\"zkHeading\":\"Zero-knowledge design\",\"zkBody\":\"There is no SecureVault server holding your vault key or document plaintext. Optional exports and backups are initiated by you. Demo mode uses session-only sample data and never writes to your encrypted vault.\",\"webauthnHeading\":\"WebAuthn / FIDO2\",\"webauthnBody\":\"Optional biometric unlock uses platform authenticators (fingerprint or Face ID) via WebAuthn. Biometrics prove presence on the device; the vault encryption key is still derived from your password.\",\"offlineHeading\":\"Offline-first storage\",\"offlineBody\":\"Encrypted records live in IndexedDB on this device. The app is built to work without internet for day-to-day vault use — browse, add, and organise documents locally.\",\"threatHeading\":\"Threat model (summary)\",\"threatBody\":\"SecureVault protects against casual device snooping and remote vault theft (because there is no cloud vault of yours to steal). It does not stop malware on your device, a weak password, someone who already knows your PIN, or physical access while the vault is unlocked. Use a long unique passphrase, lock the vault when idle, and keep your own encrypted backups. For legal and privacy context see About and the Privacy Policy.\",\"linkAbout\":\"About, terms \u0026 DPDP\",\"linkPrivacy\":\"Privacy Policy\"},\"categories\":{\"password-vault\":{\"label\":\"Passwords\",\"shortLabel\":\"Passwords\",\"fields\":{\"website_app\":\"Website / App\",\"login_url\":\"Login URL\",\"user_id_email\":\"User ID / Email\",\"password\":\"Password\",\"2fa_recovery\":\"2FA / Recovery notes\"}},\"government-ids\":{\"label\":\"G
